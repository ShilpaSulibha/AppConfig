apiVersion: apps/v1
kind: Deployment
metadata:
  name: itaap--icon-deployment
  namespace: {{deployNamespace}}
  labels:
    app: itaap--icon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: itaap--icon
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: itaap--icon
    spec:
      containers:
        - name: itaap--icon-container
          image: >-
            {{}}

          ports:
            - containerPort: 8085
              protocol: TCP     
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: cloud
            - name: APP_VERSION
              value: {{appVersion}}
            - name: APP_ENV
              value: {{appEnv}}
            - name: URL
              valueFrom:
                configMapKeyRef:
                  name: audit-connector-data
                  key: URL
            - name: USERNAME
              valueFrom:
                configMapKeyRef:
                  name: audit-connector-data
                  key: USERNAME
            - name: PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: audit-connector-data
                  key: PASSWORD
            - name: API_EMAIL_BASEURL
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: API_EMAIL_BASEURL
            - name: API_EMAIL_PATHURL
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: API_EMAIL_PATHURL
            - name: API_EMAIL_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: API_EMAIL_USERNAME
            - name: API_EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: itaap--icon
                  key: API_EMAIL_PASSWORD
            - name: API_EMAIL_TOLIST
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: API_EMAIL_TOLIST
            - name: API_EMAIL_CCLIST
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: API_EMAIL_CCLIST
            - name: API_EMAIL_BODY
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: API_EMAIL_BODY
            - name: WEBCIENT_RETRY_MAXRETRY
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: WEBCIENT_RETRY_MAXRETRY
            - name: WEBCIENT_RETRY_DELAY
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: WEBCIENT_RETRY_DELAY
            - name: WEBCIENT_RESPONSE_TIMEOUT
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: WEBCIENT_RESPONSE_TIMEOUT
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: DB_USERNAME
            - name: ICON_DB_HOSTNAME
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: ICON_DB_HOSTNAME
            - name: ICON_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: ICON_DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: itaap--icon
                  key: DB_PASSWORD
            - name: ENV_IDENTIFIER
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: ENV_IDENTIFIER
            - name: SFTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: SFTP_HOST
            - name: SFTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: SFTP_PORT
            - name: SFTP_USER
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: SFTP_USER
            - name: SFTP_REMOTE_DIRECTORY
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: SFTP_REMOTE_DIRECTORY
            - name: SFTP_TIMEOUT_SESSION
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: SFTP_TIMEOUT_SESSION
            - name: SFTP_TIMEOUT_CHANNEL
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: SFTP_TIMEOUT_CHANNEL
            - name: LOG_LEVEL_ROOT
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: LOG_LEVEL_ROOT
            - name: LOG_LEVEL_SERVICE
              valueFrom:
                configMapKeyRef:
                  name: itaap--icon
                  key: LOG_LEVEL_SERVICE
            - name: SFTP_HOST_KEY
              valueFrom:
                secretKeyRef:
                  name: itaap--icon
                  key: SFTP_HOST_KEY
            - name: SFTP_KNOWN_HOST
              valueFrom:
                secretKeyRef:
                  name: itaap--icon
                  key: SFTP_KNOWN_HOST
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
          resources:
           requests:
             memory: "256Mi"
           limits:
             memory: "1Gi"
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64                        
      restartPolicy: Always
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600


---

apiVersion: v1
kind: Service
metadata:
  name: itaap--icon-service
  namespace: {{deployNamespace}}
  labels:
    app: itaap--icon
spec:
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  selector:
    app: itaap--icon

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: itaap--icon-ingress
  annotations:
    nginx.ingress.kubernetes.io/auth-url: http://token-manage-service.itaap-{{env}}-common.svc.cluster.local/token/auth
    nginx.ingress.kubernetes.io/auth-response-headers: "authorization"
    nginx.ingress.kubernetes.io/auth-cache-key: '$http_authorization$request_uri'
    nginx.ingress.kubernetes.io/auth-cache-duration: '5m'
    kubernetes.io/ingress.class: "nginx"
  namespace: {{deployNamespace}}
spec:
  defaultBackend:
    service:
      name: itaap--icon-service
      port:
        number: 80
  tls:
    - hosts:
        - {{host}}
      secretName: itaap--icon-secret
  rules:
    - host: {{host}}
      http:
        paths:
          - path: {{envIdentifier}}/api/
            pathType: Prefix
            backend:
              service:
                name: itaap--icon-service
                port:
                  number: 80